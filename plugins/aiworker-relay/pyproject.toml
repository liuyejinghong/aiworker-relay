[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-orchestrator"
dynamic = ["version"]
description = "A Codex-led, CLI-first coding-agent orchestrator."
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
    "psutil==7.2.2",
    "keyring==25.7.0",
    "truststore==0.10.4",
]

[project.scripts]
orch = "orchestrator.cli:main"
external-workersd = "orchestrator.daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = ["src/orchestrator/VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator = ["VERSION", "web/*.html", "web/*.css", "web/*.js"]
